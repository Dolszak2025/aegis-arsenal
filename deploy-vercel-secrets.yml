name: Deploy Vercel Secrets with Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**' # Uruchom workflow tylko, gdy zmiany dotyczą katalogu Terraform
  workflow_dispatch: # Pozwala na ręczne uruchomienie workflow

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Wymagane, jeśli używasz OIDC do uwierzytelniania w chmurze, np. AWS Secrets Manager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.x.x # Użyj odpowiedniej wersji Terraform

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform # Upewnij się, że Terraform działa w katalogu z plikami .tf

      - name: Terraform Plan
        run: terraform plan -input=false
        working-directory: ./terraform
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }} # Token do uwierzytelniania providera Vercel
          # Przekazanie zmiennych Terraform z GitHub Secrets
          TF_VAR_vercel_token_app: ${{ secrets.APP_VERCEL_TOKEN }}
          TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' # Uruchom apply tylko dla gałęzi main
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          TF_VAR_vercel_token_app: ${{ secrets.APP_VERCEL_TOKEN }}
          TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}